<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Fusion API project thumbnail">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#0f0b18"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <circle cx="520" cy="520" r="280" fill="#a78bfa" fill-opacity="0.10" filter="url(#soft)"/>
  <circle cx="1180" cy="380" r="260" fill="#22d3ee" fill-opacity="0.06" filter="url(#soft)"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2">
    <path d="M300 360 H840"/>
    <path d="M300 420 H760"/>
    <path d="M300 480 H900"/>
    <path d="M300 540 H700"/>
    <path d="M300 600 H820"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" fill="#ffffff">
    <text x="120" y="170" font-size="18" fill-opacity="0.72" letter-spacing="3">PROJECT 04</text>
    <text x="120" y="235" font-size="64" font-weight="700">Fusion API</text>
    <text x="120" y="290" font-size="22" fill-opacity="0.72">Backend services for meal planning + auth</text>

    <g transform="translate(120 345)" fill-opacity="0.82">
      <rect x="0" y="0" rx="18" ry="18" width="220" height="40" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="18" y="26" font-size="16" fill-opacity="0.85">Node · Express</text>

      <rect x="240" y="0" rx="18" ry="18" width="340" height="40" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="258" y="26" font-size="16" fill-opacity="0.85">Spoonacular · Nutritionix</text>
    </g>
  </g>

  <rect x="110" y="110" width="1380" height="680" rx="40" ry="40" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
