<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Fusion app project thumbnail">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#0b1a14"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <circle cx="600" cy="420" r="260" fill="#22c55e" fill-opacity="0.10" filter="url(#soft)"/>
  <circle cx="1120" cy="460" r="260" fill="#22d3ee" fill-opacity="0.08" filter="url(#soft)"/>

  <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="980" y="240" width="420" height="540" rx="48"/>
    <rect x="1020" y="310" width="340" height="18" rx="9"/>
    <rect x="1020" y="350" width="240" height="18" rx="9"/>
    <rect x="1020" y="410" width="320" height="110" rx="18"/>
    <rect x="1020" y="540" width="320" height="110" rx="18"/>
    <rect x="1020" y="670" width="200" height="18" rx="9"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" fill="#ffffff">
    <text x="120" y="170" font-size="18" fill-opacity="0.72" letter-spacing="3">PROJECT 03</text>
    <text x="120" y="235" font-size="64" font-weight="700">Fusion</text>
    <text x="120" y="290" font-size="22" fill-opacity="0.72">Recipe search + meal planning + multi-language</text>

    <g transform="translate(120 345)" fill-opacity="0.82">
      <rect x="0" y="0" rx="18" ry="18" width="210" height="40" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="18" y="26" font-size="16" fill-opacity="0.85">Kotlin · Android</text>

      <rect x="230" y="0" rx="18" ry="18" width="240" height="40" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="248" y="26" font-size="16" fill-opacity="0.85">Firebase · Retrofit</text>
    </g>
  </g>

  <rect x="110" y="110" width="1380" height="680" rx="40" ry="40" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
