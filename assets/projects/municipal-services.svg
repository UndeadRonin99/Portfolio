<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Municipal Services App project thumbnail">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12100b"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <circle cx="560" cy="380" r="240" fill="#f59e0b" fill-opacity="0.10" filter="url(#soft)"/>
  <circle cx="1120" cy="560" r="280" fill="#22d3ee" fill-opacity="0.06" filter="url(#soft)"/>

  <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="950" y="260" width="500" height="420" rx="28"/>
    <rect x="990" y="310" width="420" height="26" rx="10"/>
    <rect x="990" y="360" width="380" height="18" rx="9"/>
    <rect x="990" y="398" width="340" height="18" rx="9"/>
    <rect x="990" y="450" width="420" height="160" rx="18"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" fill="#ffffff">
    <text x="120" y="170" font-size="18" fill-opacity="0.72" letter-spacing="3">PROJECT 05</text>
    <text x="120" y="235" font-size="64" font-weight="700">Municipal Services App</text>
    <text x="120" y="290" font-size="22" fill-opacity="0.72">Issue reporting desktop app</text>

    <g transform="translate(120 345)" fill-opacity="0.82">
      <rect x="0" y="0" rx="18" ry="18" width="220" height="40" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="18" y="26" font-size="16" fill-opacity="0.85">C# · .NET</text>

      <rect x="240" y="0" rx="18" ry="18" width="230" height="40" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="258" y="26" font-size="16" fill-opacity="0.85">Windows Forms</text>
    </g>
  </g>

  <rect x="110" y="110" width="1380" height="680" rx="40" ry="40" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
