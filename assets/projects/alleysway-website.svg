<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Alleysway Website project thumbnail">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#140a12"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <rect x="260" y="210" width="1080" height="560" rx="28" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="300" y="260" width="620" height="34" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="300" y="320" width="540" height="18" rx="9" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="300" y="356" width="500" height="18" rx="9" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="300" y="392" width="460" height="18" rx="9" fill="#ffffff" fill-opacity="0.05"/>

  <circle cx="1220" cy="320" r="180" fill="#ec4899" fill-opacity="0.10" filter="url(#soft)"/>
  <circle cx="520" cy="620" r="210" fill="#22d3ee" fill-opacity="0.08" filter="url(#soft)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" fill="#ffffff">
    <text x="120" y="170" font-size="18" fill-opacity="0.72" letter-spacing="3">PROJECT 02</text>
    <text x="120" y="235" font-size="64" font-weight="700">Alleysway Website</text>
    <text x="120" y="290" font-size="22" fill-opacity="0.72">ASP.NET Core MVC gym platform</text>

    <g transform="translate(120 345)" fill-opacity="0.82">
      <rect x="0" y="0" rx="18" ry="18" width="320" height="40" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="18" y="26" font-size="16" fill-opacity="0.85">C# · ASP.NET Core · MVC</text>

      <rect x="340" y="0" rx="18" ry="18" width="200" height="40" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="358" y="26" font-size="16" fill-opacity="0.85">SQL Server</text>
    </g>
  </g>

  <rect x="110" y="110" width="1380" height="680" rx="40" ry="40" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
